    - assets/car_logos/
    
   
  
  
flutter_native_splash:
  color: "#FFFFFF"
  image: assets/logo/fines_logo.png
  android: true
  ios: true
  android_gravity: center
  ios_content_mode: center
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/logo/fines_logo_512.png
  adaptive_icon_background: "#FFFFFF"
  remove_alpha_ios: true
