    # Declaring the directory keeps builds valid when .env is absent.
    - assets/config/
    - assets/licenses/
    - assets/icons/map.png
    - assets/icons/google_logo.png
    - assets/icons/logo_app.png
    - assets/icons/insurance.png
    - assets/icons/car-wash.svg
    - assets/icons/no_ad.svg
    - assets/icons/tuning.jpg
    - assets/icons/battery.png
    - assets/icons/brake.png
    - assets/icons/chassis.png
    - assets/icons/conditioning.png
    - assets/icons/cooling_radiator.png
    - assets/icons/muffler.png
    - assets/icons/oil_service.png
    - assets/icons/transmission.jpg
    - assets/icons/wheels.png
    - assets/fonts/Fines/Roboto-Regular.ttf
    - assets/images/cars/tesla_model_x_red.png
    - assets/images/onboarding_insurance.jpg
    - assets/images/onboarding_fines.jpg
    - assets/images/analytics_bg.png
    - assets/images/maintenance_bg.png
    - assets/icons/insurance.png
    - assets/icons/finance.png
    - assets/icons/coin_stack.png
    - assets/icons/steeringWheel.png
