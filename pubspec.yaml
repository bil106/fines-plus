dev_dependencies:
  flutter_test:
    sdk: flutter
  melos: ^3.0.0
  flutter_lints: ^5.0.0
 

  build_runner: ^2.4.0
  json_serializable: ^6.8.0

  auto_route_generator: ^10.2.3


flutter:

  config:
    enable-swift-package-manager: false

  uses-material-design: true
  
  assets:
