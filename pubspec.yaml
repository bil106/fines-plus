name: fines_plus
description: "A new Flutter project."

publish_to: 'none' 
version: 1.0.10+99

environment:
  sdk: ^3.8.1


dependencies:
  flutter:
    sdk: flutter
  core_repository:
    path: packages/core_repository

  core_cubit:
    path: packages/core_cubit
  core_localization:
    path: packages/core_localization
