<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FinesPlus</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 50px;
      background: #f5f5f5;
    }

    h1 {
      color: #333;
    }

    .btn {
      display: block;
      margin: 20px auto;
      padding: 15px 25px;
      font-size: 16px;
      color: #fff;
      background: #039be5;
      border-radius: 5px;
      text-decoration: none;
      width: 220px;
    }
  </style>
</head>

<body>
  <h1>FinesPlus</h1>
  <p>НClick the button to open the app or continue on the web version.</p>

<a id="openAppBtn" class="btn" href="finesplus://addCar?ref=partner42">
Open the application (Add a car)
</a>
<a id="openWebBtn" class="btn" href="https://finesplus.web.app/addCar">
Open web version
</a>

  <script>
    function getQueryParam(name) {
      const params = new URLSearchParams(window.location.search);
      return params.get(name);
    }

    const ref = getQueryParam('ref') || '';
    const car = getQueryParam('car') || '';

    const appUrl = `https://finesplus.web.app/addCar?ref=partner42`;
    const webUrl = `https://finesplus.web.app/history?car=${car}`;

    const btnApp = document.getElementById('openAppBtn');
    const btnWeb = document.getElementById('openWebBtn');

    btnApp.href = appUrl;
    btnWeb.href = webUrl;

  
  </script>
</body>

</html>
