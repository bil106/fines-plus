name: design_system
description: Shared UI components and theme
publish_to: none

version: 0.0.1
environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter


dev_dependencies:
  build_runner: ^2.4.15
  flutter_gen_runner: ^5.10.0

flutter:
  fonts:
    - family: FinesRoboto
      fonts:
        - asset: lib/fonts/Fines/Roboto-Regular.ttf
          weight: 400
          style: normal
        - asset: lib/fonts/Fines/Roboto-Bold.ttf
          weight: 700
          style: normal
        - asset: lib/fonts/Fines/Roboto-Italic.ttf
          weight: 400
          style: italic
        - asset: lib/fonts/Fines/Roboto-BoldItalic.ttf
          weight: 700
          style: italic

