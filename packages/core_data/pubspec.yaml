name: core_data
description: Data sources for car info storage
version: 1.0.0
publish_to: "none"

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cloud_firestore: ^5.0.0
  equatable: ^2.0.7
  flutter_local_notifications: ^19.4.0
  http: ^1.5.0
  shared_preferences: ^2.2.0
  timezone: ^0.10.1
  dio: ^5.4.0
  firebase_core: ^3.15.2
  get_it: ^8.2.0
  firebase_auth: ^5.7.0
  google_maps_flutter: ^2.13.1
  geolocator: ^14.0.2

  core_repository:
    path: ../core_repository
  core_services:
    path: ../core_services
  core_localization:
    path: ../core_localization
